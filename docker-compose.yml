# Local run, or a Coolify "Docker Compose" deployment.
services:
  momentcap:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - momentcap-data:/data
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    restart: unless-stopped

volumes:
  momentcap-data:
